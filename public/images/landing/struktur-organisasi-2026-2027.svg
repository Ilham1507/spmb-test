<title id="title">Struktur organisasi SMK Muhammadiyah 4 Cileungsi, periode 2026–2027</title>
<desc id="desc">PCM Cileungsi membawahi Majelis Dikdasmen dan Kepala Sekolah. Tata Usaha terhubung ke Kepala Sekolah. Dua waka membawahi unit masing-masing; Kasie Branding dan Lab. Kom terhubung ke kedua waka. Guru berada di bagian bawah bagan.</desc>
