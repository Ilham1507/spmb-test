databases:
  - name: spmb-test-db
    plan: free
    databaseName: spmb_test
    user: spmb_test

services:
  - type: web
    name: spmb-test
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: spmb-test-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: spmb-test-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: spmb-test-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: spmb-test-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: spmb-test-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: WHATSAPP_PROVIDER
        value: waslah
      - key: WASLAH_API_TOKEN
        sync: false
      - key: WASLAH_INSTANCE_KEY
        sync: false
